name: Build for Google Play

# Every push builds the Google Play bundle (AAB, version 1.0.<run>, version code = run number)
# as an artifact. It goes to Play's internal testing track only when asked: run this workflow
# by hand (Actions → Build for Google Play → Run workflow) with "publish" ticked.
# Play installs and updates the app; there are no GitHub releases.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Upload this build to Google Play internal testing
        type: boolean
        default: false
      notes:
        description: Release notes (English, shown to testers)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No Gradle wrapper in the repo: CI installs this Gradle version itself.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi
          if [ ! -f app/google-services.json ]; then
            # Still compile, so every push is checked, but such an APK can't receive alerts
            # and is never published.
            echo "::warning::No Firebase config (app/google-services.json or the GOOGLE_SERVICES_JSON secret): building with a placeholder; this APK will not receive alerts."
            echo "FIREBASE_PLACEHOLDER=1" >> "$GITHUB_ENV"
            cat > app/google-services.json <<'JSON'
          {
            "project_info": { "project_number": "000000000000", "project_id": "placeholder", "storage_bucket": "placeholder.appspot.com" },
            "client": [{
              "client_info": { "mobilesdk_app_id": "1:000000000000:android:0000000000000000", "android_client_info": { "package_name": "com.dio.alert" } },
              "oauth_client": [],
              "api_key": [{ "current_key": "placeholder" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          JSON
          fi

      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_BASE64 secret: the bundle is signed with a throwaway debug key, which Google Play will not accept as the upload key."
          fi

      - name: Version
        id: version
        run: echo "name=1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          RECAPTCHA_SITE_KEY: ${{ vars.RECAPTCHA_SITE_KEY }}
        run: |
          gradle bundleRelease --no-daemon
          mv app/build/outputs/bundle/release/app-release.aab dio-alert.aab

      - uses: actions/upload-artifact@v4
        with:
          name: dio-alert
          path: dio-alert.aab

      # Google Play, internal testing track: only on a manual run with "publish" ticked.
      # Needs the secret PLAY_SERVICE_ACCOUNT_JSON (a service account invited in Play Console
      # with release rights). The release rolls out to testers at once ("completed"); set the
      # repo variable PLAY_RELEASE_STATUS to "draft" to review it in Play Console first.
      - name: Check Google Play upload
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          NOTES: ${{ inputs.notes }}
        run: |
          if [ "$FIREBASE_PLACEHOLDER" = "1" ]; then
            echo "::error::A build with the placeholder Firebase config can't receive alerts; not publishing."; exit 1
          fi
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::The PLAY_SERVICE_ACCOUNT_JSON secret is not set."; exit 1
          fi
          mkdir -p whatsnew
          if [ -n "$NOTES" ]; then printf '%s' "$NOTES" > whatsnew/whatsnew-en-US; fi

      - name: Upload to Google Play
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.dio.alert
          releaseFiles: dio-alert.aab
          track: internal
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          whatsNewDirectory: whatsnew
